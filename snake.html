<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>貪食蛇</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 10px; }
    .info { font-size: 18px; margin-bottom: 10px; display: flex; gap: 20px; }
    canvas {
      border: 3px solid #fff;
      background-color: #000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <h1>貪食蛇 Snake - 用鍵盤上下左右或awsd</h1>
  <div class="info">
    <div id="score">分數: 0</div>
    <div id="speed">速度等級: 1</div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const speedElement = document.getElementById("speed");

    const gridSize = 20; // 每個格子的大小 (px)
    const tileCount = canvas.width / gridSize; // 20x20 格

    let snake = [{ x: 10, y: 10 }];
    let dx = 1; // 初始 X 軸移動方向 (向右)
    let dy = 0; // 初始 Y 軸移動方向
    let food = { x: 15, y: 15 };
    let score = 0;
    
    // 速度相關設定
    const initialDelay = 200; // 初始速度放慢（每幀 200ms）
    const minDelay = 50;       // 最快限制（每幀 50ms）
    let currentDelay = initialDelay;
    let gameTimeout = null;
    let changingDirection = false; // 防止在單一幀內連續按鍵導致自殺

    // 啟動遊戲
    gameLoop();

    // 鍵盤操控監聽
    document.addEventListener("keydown", changeDirection);

    function gameLoop() {
      update();
      draw();
      changingDirection = false; // 重置按鍵鎖

      // 依當前蛇身長度計算速度（每長長 1 格減少 5ms 間隔，不低於 minDelay）
      const speedFactor = (snake.length - 1) * 5;
      currentDelay = Math.max(minDelay, initialDelay - speedFactor);

      // 更新速度等級顯示
      const speedLevel = Math.floor((initialDelay - currentDelay) / 10) + 1;
      speedElement.textContent = `速度等級: ${speedLevel}`;

      // 使用 setTimeout 實現動態間隔的循環
      gameTimeout = setTimeout(gameLoop, currentDelay);
    }

    function update() {
      // 1. 計算新蛇頭位置
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // 2. 撞牆檢測
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
      }

      // 3. 撞到自己身體檢測
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          return gameOver();
        }
      }

      // 將新頭部加入蛇身陣列的最前面
      snake.unshift(head);

      // 4. 吃到食物檢測
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = `分數: ${score}`;
        generateFood();
      } else {
        // 沒有吃到食物，移除蛇尾
        snake.pop();
      }
    }

    function draw() {
      // 清空畫布
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 畫食物
      ctx.fillStyle = "#ff4d4d";
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

      // 畫蛇身
      snake.forEach((segment, index) => {
        // 蛇頭用亮綠色，蛇身用深綠色
        ctx.fillStyle = index === 0 ? "#81c784" : "#4caf50";
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      });
    }

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // 確保食物不會刷在蛇身上
      for (let segment of snake) {
        if (food.x === segment.x && food.y === segment.y) {
          generateFood();
          break;
        }
      }
    }

    function changeDirection(event) {
      if (changingDirection) return; // 如果這一幀已經轉過向，忽略後續按鍵

      const keyPressed = event.key;
      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      if ((keyPressed === "ArrowLeft" || keyPressed === "a") && !goingRight) {
        dx = -1; dy = 0; changingDirection = true;
      } else if ((keyPressed === "ArrowUp" || keyPressed === "w") && !goingDown) {
        dx = 0; dy = -1; changingDirection = true;
      } else if ((keyPressed === "ArrowRight" || keyPressed === "d") && !goingLeft) {
        dx = 1; dy = 0; changingDirection = true;
      } else if ((keyPressed === "ArrowDown" || keyPressed === "s") && !goingUp) { // 修正原本 !goingRight 的錯誤
        dx = 0; dy = 1; changingDirection = true;
      }
    }

    function gameOver() {
      clearTimeout(gameTimeout);
      alert(`遊戲結束！最終長度：${snake.length}，得分：${score}`);
      location.reload();
    }
  </script>
</body>
</html>
