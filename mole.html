<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>純前端打地鼠</title>
  <style>
    body {
      background-color: #2c3e50;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }
    h1 { margin-bottom: 5px; }
    .header {
      display: flex;
      gap: 20px;
      font-size: 20px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    button:hover { background-color: #219150; }

    /* 遊戲板佈局 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-gap: 20px;
    }
    .hole {
      width: 120px;
      height: 120px;
      background-color: #8e44ad;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 10px 0 rgba(0,0,0,0.3);
    }
    /* 地鼠圖樣 (純 CSS 繪製) */
    .mole {
      width: 80px;
      height: 90px;
      background-color: #d35400;
      border-radius: 40px 40px 0 0;
      position: absolute;
      bottom: -90px; /* 初始藏在地洞下方 */
      left: 20px;
      transition: bottom 0.1s ease-out;
      cursor: pointer;
    }
    /* 地鼠眼睛與鼻子 */
    .mole::before, .mole::after {
      content: '';
      position: absolute;
      background-color: #000;
      border-radius: 50%;
    }
    /* 眼睛 */
    .mole::before {
      width: 10px; height: 10px;
      top: 25px; left: 20px;
      box-shadow: 30px 0 0 #000;
    }
    /* 鼻子 */
    .mole::after {
      width: 16px; height: 10px;
      background-color: #e74c3c;
      top: 40px; left: 32px;
    }

    /* 地鼠冒出的狀態 */
    .hole.up .mole {
      bottom: 0;
    }
  </style>
</head>
<body>

  <h1>打地鼠 Whack-A-Mole</h1>
  <div class="header">
    <div>分數: <span id="score">0</span></div>
    <div>剩餘時間: <span id="timer">20</span>s</div>
  </div>
  <button id="startBtn" onclick="startGame()">開始遊戲</button>

  <div class="grid">
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
  </div>

  <script>
    const holes = document.querySelectorAll('.hole');
    const moles = document.querySelectorAll('.mole');
    const scoreBoard = document.getElementById('score');
    const timerBoard = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');

    let lastHole;
    let timeUp = false;
    let score = 0;
    let countdown = 20;
    let timerInterval;

    function randomTime(min, max) {
      return Math.round(Math.random() * (max - min) + min);
    }

    function randomHole(holes) {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      // 避免連續在同一個洞冒出
      if (hole === lastHole) {
        return randomHole(holes);
      }
      lastHole = hole;
      return hole;
    }

    function popUp() {
      // 隨分數提高速度 (停留時間 400ms ~ 1000ms 隨動態遞減)
      const speedBonus = Math.min(score * 20, 400); 
      const time = randomTime(800 - speedBonus, 1200 - speedBonus);
      const hole = randomHole(holes);
      
      hole.classList.add('up');

      setTimeout(() => {
        hole.classList.remove('up');
        if (!timeUp) popUp();
      }, time);
    }

    function startGame() {
      score = 0;
      countdown = 20;
      timeUp = false;
      scoreBoard.textContent = 0;
      timerBoard.textContent = countdown;
      startBtn.disabled = true;

      popUp();

      // 倒數計時
      timerInterval = setInterval(() => {
        countdown--;
        timerBoard.textContent = countdown;
        if (countdown <= 0) {
          clearInterval(timerInterval);
          timeUp = true;
          startBtn.disabled = false;
          alert(`時間到！你的得分是：${score}`);
        }
      }, 1000);
    }

    function whack(e) {
      if(!e.isTrusted) return; // 防止腳本偽造點擊
      
      score++;
      this.parentNode.classList.remove('up'); // 被打中後立即縮回
      scoreBoard.textContent = score;
    }

    moles.forEach(mole => mole.addEventListener('click', whack));
  </script>
</body>
</html>
