<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打俄羅斯方塊</title>
    <!-- 引入 SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333333;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --pending-color: #7f8c8d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
        }

        /* 右上角最佳成績與統計卡片 */
        .best-score-card {
            background: #fff8e1;
            border: 1px solid #ffe082;
            padding: 10px 16px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            min-width: 250px;
        }

        .best-score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px dashed #ffe082;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        .best-score-title {
            font-size: 14px;
            font-weight: bold;
            color: #f57f17;
        }

        .upload-btn {
            background-color: #27ae60;
            color: white;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upload-btn:hover:not(:disabled) {
            background-color: #219150;
        }

        .upload-btn:disabled {
            background-color: #a3e0b8;
            cursor: not-allowed;
        }

        .best-score-details {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            width: 100%;
        }

        .best-score-details div {
            display: flex;
            justify-content: space-between;
        }

        .best-score-details span.val {
            font-weight: bold;
            color: #d84315;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select, button {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        button.main-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        button.main-btn:hover:not(:disabled) {
            background-color: #357abd;
        }

        button.main-btn:disabled {
            background-color: #a0c4e8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #eef2f5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .level-highlight {
            color: #e67e22;
        }

        /* 遊戲畫布與區域 */
        .game-area {
            position: relative;
            width: 100%;
            height: 450px;
            background: #2c3e50;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        /* 出字口標示線 */
        .spawn-line {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            border-bottom: 2px dashed #e74c3c;
            opacity: 0.5;
            pointer-events: none;
        }

        .falling-word {
            position: absolute;
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            z-index: 1;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        /* 正鎖定（輸入中）的方塊：最上層顯示 + 黃框高亮 + 微放大 */
        .falling-word.active {
            border: 2px solid #f1c40f !important;
            box-shadow: 0 0 14px #f1c40f, 0 4px 8px rgba(0,0,0,0.5);
            z-index: 10 !important;
            transform: scale(1.08);
        }

        /* 落地固定的方塊（不顯示文字） */
        .falling-word.landed {
            background-color: #7f8c8d !important;
            border: 2px solid #95a5a6 !important;
            box-shadow: none;
            color: transparent;
            z-index: 0 !important;
            transform: scale(1);
        }

        .char-correct {
            color: #2ecc71;
            text-decoration: underline;
            text-shadow: 0 0 2px rgba(0,0,0,0.8);
        }

        .char-pending {
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        /* 結算 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .new-record-tag {
            background-color: #e74c3c;
            color: white;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            display: none;
        }

        .result-list {
            text-align: left;
            margin: 20px 0;
            font-size: 18px;
            line-height: 1.8;
        }

        .swal2-custom-input {
            width: 80% !important;
            margin: 10px auto !important;
            font-size: 16px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h1>英打俄羅斯方塊</h1>
        <div class="best-score-card">
            <div class="best-score-header">
                <span class="best-score-title">🏆 本階段最佳成績</span>
                <button id="uploadBtn" class="upload-btn">上傳成績</button>
            </div>
            <div class="best-score-details">
                <div>已完成練習: <span class="val" id="bestCount">0 次</span></div>
                <div>總正確字數: <span class="val" id="totalWords">0 個</span></div>
                <div>最高正確字數: <span class="val" id="bestWords">-- 個</span></div>
                <div>正確率: <span class="val" id="bestAcc">-- %</span></div>
                <div>字數速度 (WPM): <span class="val" id="bestWPM">-- 字/分</span></div>
                <div>按鍵速度 (KPM): <span class="val" id="bestKPM">-- /分</span></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <a href="https://docs.google.com/spreadsheets/d/1D3nvNmZlJBFDq2N1Flx_bsD9XPA-xswn1K8hPGt-rDk" target="_blank">成績暫存列表</a>
        <button id="restartBtn" class="main-btn">開始 / 重新開始</button>
    </div>

    <div class="stats-bar">
        <div>等級: <span id="levelDisplay" class="level-highlight">1</span></div>
        <div>得分: <span id="scoreDisplay">0</span></div>
        <div>正確率: <span id="accuracyDisplay">100%</span></div>
        <div>消去單字: <span id="wordsCountDisplay">0</span></div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="spawn-line"></div>
    </div>
</div>

<!-- 結算 Modal -->
<div class="modal-overlay" id="resultModal">
    <div class="modal">
        <h2>遊戲結束！<span class="new-record-tag" id="newRecordTag">🎉 新紀錄！</span></h2>
        <div class="result-list">
            <p><strong>最高難度等級:</strong> Lv. <span id="resLevel">1</span></p>
            <p><strong>遊戲得分 (Score):</strong> <span id="resScore">0</span></p>
            <p><strong>正確字數 (Words):</strong> <span id="resWords">0</span> 個</p>
            <p><strong>正確率 (Accuracy):</strong> <span id="resAccuracy">0%</span></p>
            <p><strong>字數速度 (WPM):</strong> <span id="resWPM">0</span> 字/分</p>
            <p><strong>按鍵速度 (KPM):</strong> <span id="resKPM">0</span> Keystrokes/分</p>
        </div>
        <button id="closeModalBtn" class="main-btn">再試一次</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbylTCjtZQC2as73f96BKvZiUid1NCRqWbT1B2buktFkwwZ4FthWK5wRoqsZkiXTIAeE1Q/exec';

    const BLOCK_COLOR_PALETTE = [
        { bg: '#e67e22', border: '#d35400' }, // 珊瑚橘
        { bg: '#27ae60', border: '#1e8449' }, // 翡翠綠
        { bg: '#8e44ad', border: '#6c3483' }, // 紫羅蘭
        { bg: '#2980b9', border: '#1f618d' }, // 湛藍
        { bg: '#d35400', border: '#a04000' }, // 深橘紅
        { bg: '#16a085', border: '#117864' }, // 土耳其藍
        { bg: '#c0392b', border: '#962d22' }, // 深玫瑰紅
        { bg: '#f39c12', border: '#d68910' }  // 琥珀黃
    ];

    let wordPool = [];
    let activeWords = [];
    let landedBlocks = [];
    let targetWordObj = null;

    let gameInterval = null;
    let spawnTimer = null;
    let uploadCooldownTimer = null;
    
    let isPlaying = false;
    let startTime = 0;
    let gameDuration = 0;

    let score = 0;
    let totalKeystrokes = 0;
    let correctKeystrokes = 0;
    let correctWordsCount = 0;

    const BLOCK_HEIGHT = 36;
    const SPAWN_Y = 0;

    const gameArea = document.getElementById('gameArea');
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const accuracyDisplay = document.getElementById('accuracyDisplay');
    const wordsCountDisplay = document.getElementById('wordsCountDisplay');
    const restartBtn = document.getElementById('restartBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const resultModal = document.getElementById('resultModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const bestCountElem = document.getElementById('bestCount');
    const totalWordsElem = document.getElementById('totalWords');
    const bestWordsElem = document.getElementById('bestWords');
    const bestAccElem = document.getElementById('bestAcc');
    const bestWPMElem = document.getElementById('bestWPM');
    const bestKPMElem = document.getElementById('bestKPM');
    const newRecordTag = document.getElementById('newRecordTag');

    const UPLOAD_COOLDOWN_SECONDS = 30;

    // 計算當前難度等級 (修正：依據遊戲開始時間計算，不受 isPlaying 開關影響)
    function getCurrentLevel() {
        if (!startTime) return 1;
        const elapsedSeconds = (Date.now() - startTime) / 1000;
        return 1 + Math.floor(elapsedSeconds / 30);
    }

    function getMaxActiveWords() {
        const level = getCurrentLevel();
        return 2 + level;
    }

    function loadBestScore() {
        const count = sessionStorage.getItem('typing_session_count') || '0';
        const totalWords = sessionStorage.getItem('typing_total_words') || '0';
        const bestWords = sessionStorage.getItem('typing_best_words');
        
        bestCountElem.textContent = `${count} 次`;
        totalWordsElem.textContent = `${totalWords} 個`;

        if (bestWords !== null) {
            bestWordsElem.textContent = `${bestWords} 個`;
            bestAccElem.textContent = `${sessionStorage.getItem('typing_best_acc')}%`;
            bestWPMElem.textContent = `${sessionStorage.getItem('typing_best_wpm')} 字/分`;
            bestKPMElem.textContent = `${sessionStorage.getItem('typing_best_kpm')} /分`;
        } else {
            bestWordsElem.textContent = '-- 個';
            bestAccElem.textContent = '-- %';
            bestWPMElem.textContent = '-- 字/分';
            bestKPMElem.textContent = '-- /分';
        }
    }

    function checkAndUpdateBestScore(words, acc, wpm, kpm) {
        let count = parseInt(sessionStorage.getItem('typing_session_count') || '0');
        count++;
        sessionStorage.setItem('typing_session_count', count);

        let totalWords = parseInt(sessionStorage.getItem('typing_total_words') || '0');
        totalWords += words;
        sessionStorage.setItem('typing_total_words', totalWords);

        const currentBestWords = sessionStorage.getItem('typing_best_words');
        let isNewRecord = false;

        if (currentBestWords === null || words > parseInt(currentBestWords)) {
            sessionStorage.setItem('typing_best_words', words);
            sessionStorage.setItem('typing_best_acc', acc);
            sessionStorage.setItem('typing_best_wpm', wpm);
            sessionStorage.setItem('typing_best_kpm', kpm);
            isNewRecord = true;
        }

        loadBestScore();
        return isNewRecord;
    }

    function getOrCreateSessionKey() {
        let key = sessionStorage.getItem('typing_session_key');
        if (!key) {
            key = 'KEY_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
            sessionStorage.setItem('typing_session_key', key);
        }
        return key;
    }

    async function uploadScore() {
        const bestWords = sessionStorage.getItem('typing_best_words');
        if (!bestWords) {
            Swal.fire({ icon: 'warning', title: '尚未有成績', text: '目前尚未有最佳成績可供上傳！請先完成至少一次練習。' });
            return;
        }

        const { value: formValues } = await Swal.fire({
            title: '上傳成績',
            html:
                '<input id="swal-class" class="swal2-input swal2-custom-input" type="number" placeholder="請輸入班級 (數字)">' +
                '<input id="swal-seat" class="swal2-input swal2-custom-input" type="number" placeholder="請輸入座號 (數字)">',
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: '確認上傳',
            cancelButtonText: '取消',
            preConfirm: () => {
                const className = document.getElementById('swal-class').value.trim();
                const seatNumber = document.getElementById('swal-seat').value.trim();
                if (!className || !seatNumber) {
                    Swal.showValidationMessage('請完整輸入班級與座號！');
                    return false;
                }
                return { className, seatNumber };
            }
        });

        if (!formValues) return;
        startUploadCooldown();

        const payload = {
            className: formValues.className,
            seatNumber: formValues.seatNumber,
            words: parseInt(sessionStorage.getItem('typing_best_words')),
            totalWords: parseInt(sessionStorage.getItem('typing_total_words') || '0'),
            accuracy: parseFloat(sessionStorage.getItem('typing_best_acc')),
            wpm: parseInt(sessionStorage.getItem('typing_best_wpm')),
            kpm: parseInt(sessionStorage.getItem('typing_best_kpm')),
            sessionCount: parseInt(sessionStorage.getItem('typing_session_count') || '0'),
            sessionKey: getOrCreateSessionKey()
        };

        try {
            uploadBtn.textContent = '上傳中...';
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });
            Swal.fire({ icon: 'success', title: '上傳完成！', text: '成績已成功發送至伺服器。', timer: 2000, showConfirmButton: false });
        } catch (error) {
            console.error('Upload Error:', error);
            Swal.fire({ icon: 'error', title: '上傳失敗', text: '無法發送資料，請檢查網路連線或 GAS 網址！' });
        }
    }

    function startUploadCooldown() {
        let remaining = UPLOAD_COOLDOWN_SECONDS;
        uploadBtn.disabled = true;
        uploadBtn.textContent = `冷卻中(${remaining}s)`;
        uploadCooldownTimer = setInterval(() => {
            remaining--;
            if (remaining > 0) {
                uploadBtn.textContent = `冷卻中(${remaining}s)`;
            } else {
                clearInterval(uploadCooldownTimer);
                uploadBtn.disabled = false;
                uploadBtn.textContent = '上傳成績';
            }
        }, 1000);
    }

    async function fetchMoreWords() {
        try {
            const response = await fetch('https://random-word-api.herokuapp.com/word?number=100');
            const data = await response.json();
            const cleanData = data.map(w => w.toLowerCase()).filter(w => /^[a-z]+$/.test(w));
            wordPool.push(...cleanData);
        } catch (error) {
            console.error('Fetch error:', error);
            wordPool.push("apple", "banana", "orange", "grape", "cherry", "lemon", "mango", "pear", "peach", "plum");
        }
    }

    async function spawnWord() {
        if (!isPlaying) return;
        
        const currentLevel = getCurrentLevel();
        levelDisplay.textContent = currentLevel;

        const maxActive = getMaxActiveWords();
        if (activeWords.length >= maxActive) return;

        if (wordPool.length < 10) {
            await fetchMoreWords();
        }

        const existingFirstChars = new Set(activeWords.map(obj => obj.word[0]));
        let foundIndex = wordPool.findIndex(word => !existingFirstChars.has(word[0]));

        if (foundIndex === -1) return;

        const usedColorIndices = new Set(activeWords.map(obj => obj.colorIndex));
        const availableColorIndices = BLOCK_COLOR_PALETTE
            .map((_, index) => index)
            .filter(index => !usedColorIndices.has(index));

        let chosenColorIndex;
        if (availableColorIndices.length > 0) {
            chosenColorIndex = availableColorIndices[Math.floor(Math.random() * availableColorIndices.length)];
        } else {
            chosenColorIndex = Math.floor(Math.random() * BLOCK_COLOR_PALETTE.length);
        }

        const colorStyle = BLOCK_COLOR_PALETTE[chosenColorIndex];

        const word = wordPool.splice(foundIndex, 1)[0];
        const width = Math.max(70, word.length * 15 + 24); 
        const maxX = gameArea.clientWidth - width - 10;
        const x = Math.max(10, Math.floor(Math.random() * maxX));

        const wordElem = document.createElement('div');
        wordElem.className = 'falling-word';
        wordElem.style.left = `${x}px`;
        wordElem.style.top = `${SPAWN_Y}px`;
        wordElem.style.width = `${width}px`;
        wordElem.style.backgroundColor = colorStyle.bg;
        wordElem.style.border = `2px solid ${colorStyle.border}`;
        wordElem.innerHTML = renderWordHTML(word, 0);

        gameArea.appendChild(wordElem);

        const baseSpeed = 0.12 + (currentLevel - 1) * 0.05;
        const speed = baseSpeed + Math.random() * 0.08;

        activeWords.push({
            word: word,
            typedIndex: 0,
            x: x,
            y: SPAWN_Y,
            width: width,
            speed: speed,
            colorIndex: chosenColorIndex,
            elem: wordElem
        });
    }

    function renderWordHTML(word, typedIndex) {
        let html = '';
        for (let i = 0; i < word.length; i++) {
            if (i < typedIndex) {
                html += `<span class="char-correct">${word[i]}</span>`;
            } else {
                html += `<span class="char-pending">${word[i]}</span>`;
            }
        }
        return html;
    }

    function getLandY(wordObj) {
        const bottomLimit = gameArea.clientHeight - BLOCK_HEIGHT;
        let highestLandY = bottomLimit;

        for (const block of landedBlocks) {
            if (wordObj.x < block.x + block.width && wordObj.x + wordObj.width > block.x) {
                const targetY = block.y - BLOCK_HEIGHT;
                if (targetY < highestLandY) {
                    highestLandY = targetY;
                }
            }
        }
        return highestLandY;
    }

    function gameLoop() {
        for (let i = activeWords.length - 1; i >= 0; i--) {
            const obj = activeWords[i];
            const landY = getLandY(obj);

            if (obj.y < landY) {
                obj.y += obj.speed;
                if (obj.y > landY) obj.y = landY;
                obj.elem.style.top = `${obj.y}px`;
            }

            if (obj.y >= landY) {
                handleBlockLand(obj);
            }
        }
    }

    function handleBlockLand(obj) {
        activeWords = activeWords.filter(item => item !== obj);

        if (targetWordObj === obj) {
            targetWordObj = null;
        }

        obj.elem.classList.remove('active');
        obj.elem.classList.add('landed');
        obj.elem.textContent = ''; 

        landedBlocks.push({
            x: obj.x,
            y: obj.y,
            width: obj.width,
            height: BLOCK_HEIGHT,
            elem: obj.elem
        });

        if (obj.y <= 40) {
            endGame();
        }
    }

    function updateAccuracy() {
        if (totalKeystrokes === 0) {
            accuracyDisplay.textContent = '100%';
            return 100;
        }
        const acc = Math.max(0, Math.round((correctKeystrokes / totalKeystrokes) * 100));
        accuracyDisplay.textContent = `${acc}%`;
        return acc;
    }

    window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        if (e.key.length !== 1 || !/[a-zA-Z]/.test(e.key)) return;

        const typedChar = e.key.toLowerCase();
        totalKeystrokes++;

        if (targetWordObj) {
            const expectedChar = targetWordObj.word[targetWordObj.typedIndex];
            
            if (typedChar === expectedChar) {
                correctKeystrokes++;
                targetWordObj.typedIndex++;
                targetWordObj.elem.innerHTML = renderWordHTML(targetWordObj.word, targetWordObj.typedIndex);

                if (targetWordObj.typedIndex >= targetWordObj.word.length) {
                    eliminateWord(targetWordObj);
                    targetWordObj = null;
                }
            }
        } else {
            const matchObj = activeWords.find(obj => obj.word[0] === typedChar);
            if (matchObj) {
                correctKeystrokes++;
                targetWordObj = matchObj;
                targetWordObj.typedIndex = 1;
                targetWordObj.elem.classList.add('active');
                targetWordObj.elem.innerHTML = renderWordHTML(targetWordObj.word, targetWordObj.typedIndex);

                if (targetWordObj.typedIndex >= targetWordObj.word.length) {
                    eliminateWord(targetWordObj);
                    targetWordObj = null;
                }
            }
        }

        updateAccuracy();
    });

    function eliminateWord(obj) {
        score += obj.word.length * 10;
        correctWordsCount++;

        scoreDisplay.textContent = score;
        wordsCountDisplay.textContent = correctWordsCount;

        if (obj.elem && obj.elem.parentNode) {
            obj.elem.parentNode.removeChild(obj.elem);
        }

        activeWords = activeWords.filter(item => item !== obj);
    }

    function startGame() {
        clearInterval(gameInterval);
        clearInterval(spawnTimer);

        gameArea.innerHTML = '<div class="spawn-line"></div>';
        activeWords = [];
        landedBlocks = [];
        targetWordObj = null;

        score = 0;
        totalKeystrokes = 0;
        correctKeystrokes = 0;
        correctWordsCount = 0;
        startTime = Date.now();

        levelDisplay.textContent = '1';
        scoreDisplay.textContent = '0';
        accuracyDisplay.textContent = '100%';
        wordsCountDisplay.textContent = '0';
        resultModal.style.display = 'none';

        isPlaying = true;

        spawnWord();
        spawnTimer = setInterval(spawnWord, 800);
        gameInterval = setInterval(gameLoop, 30);
    }

    function endGame() {
        // 先計算最高難度等級
        const finalLevel = getCurrentLevel();

        isPlaying = false;
        clearInterval(gameInterval);
        clearInterval(spawnTimer);

        gameDuration = Math.max(1, Math.round((Date.now() - startTime) / 1000));
        const minutes = gameDuration / 60;

        const finalAccuracy = updateAccuracy();
        const kpm = Math.round(correctKeystrokes / minutes);
        const wpm = Math.round(correctWordsCount / minutes);

        const isNewRecord = checkAndUpdateBestScore(correctWordsCount, finalAccuracy, wpm, kpm);
        newRecordTag.style.display = isNewRecord ? 'inline-block' : 'none';

        document.getElementById('resLevel').textContent = finalLevel;
        document.getElementById('resScore').textContent = score;
        document.getElementById('resWords').textContent = correctWordsCount;
        document.getElementById('resAccuracy').textContent = `${finalAccuracy}%`;
        document.getElementById('resWPM').textContent = wpm;
        document.getElementById('resKPM').textContent = kpm;

        resultModal.style.display = 'flex';
    }

    restartBtn.addEventListener('click', startGame);
    uploadBtn.addEventListener('click', uploadScore);
    closeModalBtn.addEventListener('click', startGame);

    window.onload = () => {
        loadBestScore();
        fetchMoreWords();
    };
</script>

</body>
</html>
