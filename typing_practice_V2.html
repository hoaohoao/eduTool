<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打速度測試</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333333;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --pending-color: #7f8c8d;
            --trans-color: #888888;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
        }

        /* 右上角最佳成績與統計卡片 */
        .best-score-card {
            background: #fff8e1;
            border: 1px solid #ffe082;
            padding: 10px 16px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            min-width: 250px;
        }

        .best-score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px dashed #ffe082;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        .best-score-title {
            font-size: 14px;
            font-weight: bold;
            color: #f57f17;
        }

        /* 上傳按鈕樣式 */
        .upload-btn {
            background-color: #27ae60;
            color: white;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upload-btn:hover:not(:disabled) {
            background-color: #219150;
        }

        .upload-btn:disabled {
            background-color: #a3e0b8;
            cursor: not-allowed;
        }

        .best-score-details {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            width: 100%;
        }

        .best-score-details div {
            display: flex;
            justify-content: space-between;
        }

        .best-score-details span.val {
            font-weight: bold;
            color: #d84315;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .time-select label {
            font-weight: bold;
            margin-right: 10px;
        }

        select, button {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        button.main-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        button.main-btn:hover:not(:disabled) {
            background-color: #357abd;
        }

        button.main-btn:disabled {
            background-color: #a0c4e8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .typing-area {
            background: #fafafa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            user-select: none;
        }

        .line {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
        }

        .line-1 {
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 15px;
        }

        .line-2 {
            opacity: 0.5;
        }

        .word-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 12px;
            border-radius: 6px;
            background: transparent;
            transition: all 0.2s ease;
        }

        .word-card.current {
            background-color: #e2eefd;
            border-bottom: 3px solid var(--primary-color);
        }

        .en-word {
            font-size: 26px;
            font-weight: 600;
            color: var(--pending-color);
            line-height: 1.2;
        }

        .zh-trans {
            font-size: 15px;
            color: var(--trans-color);
            margin-top: 4px;
            height: 20px;
        }

        .char-correct {
            color: var(--correct-color);
        }

        .char-wrong {
            color: var(--wrong-color);
            text-decoration: underline;
        }

        .input-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: var(--primary-color);
        }

        /* 結算 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .new-record-tag {
            background-color: #e74c3c;
            color: white;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            display: none;
        }

        .result-list {
            text-align: left;
            margin: 20px 0;
            font-size: 18px;
            line-height: 1.8;
        }

        .loading-text {
            text-align: center;
            color: #777;
            font-style: italic;
            font-size: 18px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h1>英打速度測試</h1>
        <!-- 右上角：完成次數、最佳成績與上傳按鈕 -->
        <div class="best-score-card">
            <div class="best-score-header">
                <span class="best-score-title">🏆 本階段最佳成績</span>
                <button id="uploadBtn" class="upload-btn">上傳成績</button>
            </div>
            <div class="best-score-details">
                <div>已完成練習: <span class="val" id="bestCount">0 次</span></div>
                <div>最高正確字數: <span class="val" id="bestWords">-- 個</span></div>
                <div>正確率: <span class="val" id="bestAcc">-- %</span></div>
                <div>字數速度 (WPM): <span class="val" id="bestWPM">-- 字/分</span></div>
                <div>按鍵速度 (KPM): <span class="val" id="bestKPM">-- /分</span></div>
            </div>
        </div>
    </div>

    <div class="controls">
        
        <a href="https://docs.google.com/spreadsheets/d/1D3nvNmZlJBFDq2N1Flx_bsD9XPA-xswn1K8hPGt-rDk" target="_blank">成績暫存列表</a>
    </div>

    <div class="controls">
        <div class="time-select">
            <label for="timerSelect">選擇時間：</label>
            <select id="timerSelect">
                <option value="180">3 分鐘</option>
                <option value="300">5 分鐘</option>
            </select>
        </div>
        <button id="restartBtn" class="main-btn">重新開始</button>
    </div>

    <div class="stats-bar">
        <div>時間: <span id="timeDisplay">03:00</span></div>
        <div>正確率: <span id="accuracyDisplay">100%</span></div>
    </div>

    <!-- 雙行文字與中文翻譯區域 -->
    <div class="typing-area" id="typingArea">
        <div class="line line-1" id="line1"><div class="loading-text">正在載入單字與翻譯...</div></div>
        <div class="line line-2" id="line2"></div>
    </div>

    <input type="text" id="typingInput" class="input-box" placeholder="點擊此處輸入單字 (按空格鍵換字)..." disabled autocomplete="off">
</div>

<!-- 結算彈窗 -->
<div class="modal-overlay" id="resultModal">
    <div class="modal">
        <h2>練習完成！<span class="new-record-tag" id="newRecordTag">🎉 新紀錄！</span></h2>
        <div class="result-list">
            <p><strong>正確字數 (Words):</strong> <span id="resWords">0</span> 個</p>
            <p><strong>正確率 (Accuracy):</strong> <span id="resAccuracy">0%</span></p>
            <p><strong>字數速度 (WPM):</strong> <span id="resWPM">0</span> 字/分</p>
            <p><strong>按鍵速度 (KPM):</strong> <span id="resKPM">0</span> Keystrokes/分</p>
        </div>
        <button id="closeModalBtn" class="main-btn">再試一次</button>
    </div>
</div>

<script>
    // ⚠️ 請替換為您的 Google Apps Script Web 應用程式 URL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbylTCjtZQC2as73f96BKvZiUid1NCRqWbT1B2buktFkwwZ4FthWK5wRoqsZkiXTIAeE1Q/exec';

    let wordPool = [];         
    let line1Obj = [];       
    let line2Obj = [];       
    let currentWordIndex = 0;  
    
    let timer = null;
    let cooldownTimer = null; 
    let uploadCooldownTimer = null;
    let cooldownRemaining = 0;
    let uploadCooldownRemaining = 0;

    let timeTotal = 180;
    let timeRemaining = 180;
    let isPlaying = false;

    let totalKeystrokes = 0;
    let correctKeystrokes = 0;
    let correctWordsCount = 0;

    const line1Elem = document.getElementById('line1');
    const line2Elem = document.getElementById('line2');
    const typingInput = document.getElementById('typingInput');
    const timerSelect = document.getElementById('timerSelect');
    const timeDisplay = document.getElementById('timeDisplay');
    const accuracyDisplay = document.getElementById('accuracyDisplay');
    const restartBtn = document.getElementById('restartBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const resultModal = document.getElementById('resultModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // 右上角 DOM 元素
    const bestCountElem = document.getElementById('bestCount');
    const bestWordsElem = document.getElementById('bestWords');
    const bestAccElem = document.getElementById('bestAcc');
    const bestWPMElem = document.getElementById('bestWPM');
    const bestKPMElem = document.getElementById('bestKPM');
    const newRecordTag = document.getElementById('newRecordTag');

    const WORDS_PER_LINE = 4; 
    const COOLDOWN_SECONDS = 10; 
    const UPLOAD_COOLDOWN_SECONDS = 30; // 上傳按鈕冷卻時間 30 秒

    // 載入階段最佳成績
    function loadBestScore() {
        const count = sessionStorage.getItem('typing_session_count') || '0';
        const bestWords = sessionStorage.getItem('typing_best_words');
        
        bestCountElem.textContent = `${count} 次`;

        if (bestWords !== null) {
            bestWordsElem.textContent = `${bestWords} 個`;
            bestAccElem.textContent = `${sessionStorage.getItem('typing_best_acc')}%`;
            bestWPMElem.textContent = `${sessionStorage.getItem('typing_best_wpm')} 字/分`;
            bestKPMElem.textContent = `${sessionStorage.getItem('typing_best_kpm')} /分`;
        } else {
            bestWordsElem.textContent = '-- 個';
            bestAccElem.textContent = '-- %';
            bestWPMElem.textContent = '-- 字/分';
            bestKPMElem.textContent = '-- /分';
        }
    }

    // 檢查並更新最高紀錄
    function checkAndUpdateBestScore(words, acc, wpm, kpm) {
        let count = parseInt(sessionStorage.getItem('typing_session_count') || '0');
        count++;
        sessionStorage.setItem('typing_session_count', count);

        const currentBestWords = sessionStorage.getItem('typing_best_words');
        let isNewRecord = false;

        if (currentBestWords === null || words > parseInt(currentBestWords)) {
            sessionStorage.setItem('typing_best_words', words);
            sessionStorage.setItem('typing_best_acc', acc);
            sessionStorage.setItem('typing_best_wpm', wpm);
            sessionStorage.setItem('typing_best_kpm', kpm);
            isNewRecord = true;
        }

        loadBestScore();
        return isNewRecord;
    }

    // 上傳成績冷卻計時器 (30秒)
    function startUploadCooldown() {
        clearInterval(uploadCooldownTimer);
        uploadCooldownRemaining = UPLOAD_COOLDOWN_SECONDS;
        uploadBtn.disabled = true;
        uploadBtn.textContent = `冷卻中(${uploadCooldownRemaining}s)`;

        uploadCooldownTimer = setInterval(() => {
            uploadCooldownRemaining--;
            if (uploadCooldownRemaining > 0) {
                uploadBtn.textContent = `冷卻中(${uploadCooldownRemaining}s)`;
            } else {
                clearInterval(uploadCooldownTimer);
                uploadBtn.disabled = false;
                uploadBtn.textContent = '上傳成績';
            }
        }, 1000);
    }

    // 上傳成績邏輯
    async function uploadScore() {
        const bestWords = sessionStorage.getItem('typing_best_words');
        if (!bestWords) {
            alert('目前尚未有最佳成績可供上傳！請先完成至少一次練習。');
            return;
        }

        const className = prompt('請輸入您的班級：');
        if (className === null || className.trim() === '') {
            alert('取消上傳：班級不能為空！');
            return;
        }

        const seatNumber = prompt('請輸入您的座號：');
        if (seatNumber === null || seatNumber.trim() === '') {
            alert('取消上傳：座號不能為空！');
            return;
        }

        // 觸發 30 秒冷卻
        startUploadCooldown();

        const payload = {
            className: className.trim(),
            seatNumber: seatNumber.trim(),
            words: parseInt(sessionStorage.getItem('typing_best_words')),
            accuracy: parseFloat(sessionStorage.getItem('typing_best_acc')),
            wpm: parseInt(sessionStorage.getItem('typing_best_wpm')),
            kpm: parseInt(sessionStorage.getItem('typing_best_kpm'))
        };

        try {
            uploadBtn.textContent = '上傳中...';
            // 使用 no-cors 或 text-plain 發送避免跨域阻擋問題
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });

            alert('成績已發送上傳請求！');
        } catch (error) {
            console.error('Upload Error:', error);
            alert('上傳失敗，請檢查網路連線或 GAS 網址！');
        }
    }

    function startCooldown() {
        clearInterval(cooldownTimer);
        cooldownRemaining = COOLDOWN_SECONDS;
        restartBtn.disabled = true;
        restartBtn.textContent = `重新開始 (${cooldownRemaining}s)`;

        cooldownTimer = setInterval(() => {
            cooldownRemaining--;
            if (cooldownRemaining > 0) {
                restartBtn.textContent = `重新開始 (${cooldownRemaining}s)`;
            } else {
                clearInterval(cooldownTimer);
                restartBtn.disabled = false;
                restartBtn.textContent = '重新開始';
            }
        }, 1000);
    }

    async function translateWord(word) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${word}&langpair=en|zh-TW`);
            const data = await res.json();
            if (data && data.responseData) {
                let translation = data.responseData.translatedText;
                return translation.split(';')[0].split(',')[0];
            }
        } catch (e) {
            console.error('Translation error:', e);
        }
        return '';
    }

    async function processWordObjects(count) {
        if (wordPool.length < count) {
            await fetchMoreWords();
        }
        const rawWords = wordPool.splice(0, count);
        const objPromises = rawWords.map(async (word) => {
            const trans = await translateWord(word);
            return { word, trans };
        });
        return Promise.all(objPromises);
    }

    async function fetchMoreWords() {
        try {
            const response = await fetch('https://random-word-api.herokuapp.com/word?number=100');
            const data = await response.json();
            wordPool.push(...data);
        } catch (error) {
            console.error('Fetch error:', error);
        }
    }

    async function fetchWords() {
        line1Elem.innerHTML = '<div class="loading-text">正在載入單字與翻譯...</div>';
        line2Elem.innerHTML = '';
        
        await fetchMoreWords();
        line1Obj = await processWordObjects(WORDS_PER_LINE);
        line2Obj = await processWordObjects(WORDS_PER_LINE);
        
        renderLines();
        typingInput.disabled = false;
    }

    function renderLines() {
        line1Elem.innerHTML = '';
        line1Obj.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'word-card' + (idx === currentWordIndex ? ' current' : '');
            card.id = `card-line1-${idx}`;
            
            card.innerHTML = `
                <div class="en-word" id="line1-word-${idx}">${item.word}</div>
                <div class="zh-trans">${item.trans}</div>
            `;
            line1Elem.appendChild(card);
        });

        line2Elem.innerHTML = '';
        line2Obj.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
                <div class="en-word">${item.word}</div>
                <div class="zh-trans">${item.trans}</div>
            `;
            line2Elem.appendChild(card);
        });
    }

    async function shiftToNextLine() {
        currentWordIndex = 0;
        line1Obj = [...line2Obj];
        renderLines();

        processWordObjects(WORDS_PER_LINE).then(newObjs => {
            line2Obj = newObjs;
            line2Elem.innerHTML = '';
            line2Obj.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="en-word">${item.word}</div>
                    <div class="zh-trans">${item.trans}</div>
                `;
                line2Elem.appendChild(card);
            });
        });
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function initGame(triggerCooldown = false) {
        clearInterval(timer);
        isPlaying = false;
        timeTotal = parseInt(timerSelect.value);
        timeRemaining = timeTotal;
        timeDisplay.textContent = formatTime(timeRemaining);
        
        currentWordIndex = 0;
        totalKeystrokes = 0;
        correctKeystrokes = 0;
        correctWordsCount = 0;

        accuracyDisplay.textContent = '100%';
        typingInput.value = '';
        typingInput.disabled = true;
        resultModal.style.display = 'none';

        if (triggerCooldown) {
            startCooldown();
        }

        fetchWords();
    }

    function startTimer() {
        isPlaying = true;
        timer = setInterval(() => {
            timeRemaining--;
            timeDisplay.textContent = formatTime(timeRemaining);

            if (timeRemaining <= 0) {
                endGame();
            }
        }, 1000);
    }

    function updateAccuracy() {
        if (totalKeystrokes === 0) {
            accuracyDisplay.textContent = '100%';
            return 100;
        }
        const acc = Math.max(0, Math.round((correctKeystrokes / totalKeystrokes) * 100));
        accuracyDisplay.textContent = `${acc}%`;
        return acc;
    }

    typingInput.addEventListener('input', (e) => {
        if (!isPlaying && typingInput.value.length > 0) {
            startTimer();
        }

        const inputVal = typingInput.value;
        const currentItem = line1Obj[currentWordIndex];
        if (!currentItem) return;
        
        const currentWord = currentItem.word;
        const currentWordElem = document.getElementById(`line1-word-${currentWordIndex}`);
        const currentCard = document.getElementById(`card-line1-${currentWordIndex}`);

        if (inputVal.endsWith(' ')) {
            const trimmedInput = inputVal.trim();
            
            if (trimmedInput === currentWord) {
                correctWordsCount++;
                if (currentWordElem) currentWordElem.style.color = 'var(--correct-color)';
            } else {
                if (currentWordElem) currentWordElem.style.color = 'var(--wrong-color)';
            }

            if (currentCard) currentCard.classList.remove('current');
            currentWordIndex++;

            if (currentWordIndex >= line1Obj.length) {
                shiftToNextLine();
            } else {
                const nextCard = document.getElementById(`card-line1-${currentWordIndex}`);
                if (nextCard) nextCard.classList.add('current');
            }

            typingInput.value = '';
            return;
        }

        let formattedHTML = '';
        for (let i = 0; i < currentWord.length; i++) {
            if (i < inputVal.length) {
                if (inputVal[i] === currentWord[i]) {
                    formattedHTML += `<span class="char-correct">${currentWord[i]}</span>`;
                } else {
                    formattedHTML += `<span class="char-wrong">${currentWord[i]}</span>`;
                }
            } else {
                formattedHTML += currentWord[i];
            }
        }
        if (currentWordElem) {
            currentWordElem.innerHTML = formattedHTML;
        }
    });

    typingInput.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
            totalKeystrokes++;
            updateAccuracy();
            return;
        }

        if (e.key.length === 1) {
            totalKeystrokes++;
            
            if (line1Obj[currentWordIndex]) {
                const currentWord = line1Obj[currentWordIndex].word;
                const currentInput = typingInput.value;
                const charIndex = currentInput.length;

                if (e.key === ' ') {
                    if (currentInput === currentWord) {
                        correctKeystrokes++;
                    }
                } else if (charIndex < currentWord.length && e.key === currentWord[charIndex]) {
                    correctKeystrokes++;
                }
            }

            updateAccuracy();
        }
    });

    function endGame() {
        clearInterval(timer);
        isPlaying = false;
        typingInput.disabled = true;

        const timeSpentInMinutes = (timeTotal - timeRemaining) / 60;
        const minutes = timeSpentInMinutes > 0 ? timeSpentInMinutes : (timeTotal / 60);

        const finalAccuracy = updateAccuracy();
        const kpm = Math.round(correctKeystrokes / minutes);
        const wpm = Math.round(correctWordsCount / minutes);

        const isNewRecord = checkAndUpdateBestScore(correctWordsCount, finalAccuracy, wpm, kpm);
        newRecordTag.style.display = isNewRecord ? 'inline-block' : 'none';

        document.getElementById('resWords').textContent = correctWordsCount;
        document.getElementById('resAccuracy').textContent = `${finalAccuracy}%`;
        document.getElementById('resWPM').textContent = wpm;
        document.getElementById('resKPM').textContent = kpm;

        resultModal.style.display = 'flex';
    }

    timerSelect.addEventListener('change', () => initGame(false));
    restartBtn.addEventListener('click', () => initGame(true));
    uploadBtn.addEventListener('click', uploadScore);
    closeModalBtn.addEventListener('click', () => initGame(true));

    window.onload = () => {
        loadBestScore();
        initGame(false);
    };
</script>

</body>
</html>
